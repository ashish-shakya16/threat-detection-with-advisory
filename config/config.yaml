# Cybersecurity Threat Advisor - Configuration File

# System Settings
system:
  name: "Cybersecurity Threat Advisor"
  version: "1.0.0"
  environment: "development"  # development, production
  debug: true

# Monitoring Configuration
monitoring:
  # Interval in seconds between monitoring cycles
  system_check_interval: 5
  network_check_interval: 10
  file_check_interval: 30

  # If the same threat (same name + source) is still active and was last
  # seen within this many minutes, a new detection updates that threat's
  # occurrence count/last-seen time instead of creating a duplicate row.
  recurring_threat_window_minutes: 5
  
  # System monitoring settings
  system:
    enabled: true
    cpu_threshold: 90  # Alert if CPU usage exceeds this percentage
    memory_threshold: 85  # Alert if memory usage exceeds this percentage
    suspicious_process_names:
      - "mimikatz"
      - "metasploit"
      - "nmap"
      - "nc.exe"
      - "netcat"
    
  # Network monitoring settings
  network:
    enabled: true
    monitor_connections: true
    suspicious_ports:
      - 4444  # Metasploit default
      - 5555  # Common backdoor
      - 6666  # IRC bot
      - 31337  # Back Orifice
    max_connections_per_process: 100
    
  # File monitoring settings
  file:
    enabled: true
    watch_directories:
      - "C:\\Windows\\System32"  # Windows (example)
      - "C:\\Users"
      # Add more paths as needed
    file_extensions_to_monitor:
      - ".exe"
      - ".dll"
      - ".bat"
      - ".ps1"
      - ".sh"

# Detection Configuration
detection:
  # Rule-based detection
  rule_based:
    enabled: true
    rules_file: "config/rules.json"
    
  # ML-based anomaly detection
  ml_based:
    enabled: false  # Enable after training model
    model_path: "src/ml_models/saved_models/anomaly_detector.pkl"
    contamination: 0.1  # Expected proportion of outliers (10%)
    
  # Correlation settings
  correlation:
    enabled: true
    time_window: 60  # seconds to correlate events
    min_events_for_correlation: 3

# Risk Assessment Configuration
risk_assessment:
  # Risk scoring weights (must sum to 1.0)
  weights:
    severity: 0.4
    confidence: 0.3
    impact: 0.2
    prevalence: 0.1
  
  # Risk thresholds
  thresholds:
    low: 0.3
    medium: 0.6
    high: 0.85
  
  # Asset and exposure context (src/risk_assessment/asset_context.py).
  # device_criticality: low | medium | high | critical. Set this to how
  # important this machine is (e.g. "high" for a server holding customer data).
  asset_context:
    device_criticality: "medium"
    privileged_accounts: ['nt authority\system', 'system', 'administrator', 'root']

  # Impact factors
  impact_factors:
    data_access: 3
    system_control: 5
    network_access: 4
    privilege_escalation: 5

# Advisory Configuration
advisory:
  enabled: true
  language: "simple"  # simple, technical, detailed
  include_remediation: true
  include_examples: true

# AI Assistant Configuration
# The assistant always works offline using the local knowledge base. Set
# enabled: true and put the API key in the environment variable named by
# api_key_env (never in this file) to use a language model.
# provider: "openai-compatible" (default URL: OpenAI), "huggingface"
# (Hugging Face Inference router, e.g. model "meta-llama/Llama-3.1-8B-Instruct"),
# or "ollama" (local, no key). base_url overrides the provider default.
ai:
  enabled: false
  provider: "openai-compatible"
  api_key_env: "SECUREX_AI_API_KEY"
  base_url: ""
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 600
  timeout_seconds: 30
  # Retrieval-augmented generation (LangChain + ChromaDB + Sentence
  # Transformers from requirements-ai.txt). Falls back to keyword retrieval
  # if those packages or the embedding model are unavailable.
  rag_enabled: true
  embedding_model: "all-MiniLM-L6-v2"
  chroma_path: "data/chroma_db"
  knowledge_dir: "docs/security_knowledge"
  max_distance: 0.65  # cosine distance cut-off for relevant evidence

# Ransomware-like behaviour detection (src/detection/ransomware_monitor.py).
# Watches these folders for bursts of file modifications, renames and
# extension changes. Records paths and extensions only, never file contents.
ransomware_detection:
  enabled: true
  # Missing folders are skipped; the %OneDrive% entries cover OneDrive-redirected folders.
  watch_paths: ["~/Documents", "~/Desktop", "~/Pictures",
                "%OneDrive%/Documents", "%OneDrive%/Desktop", "%OneDrive%/Pictures"]
  thresholds:
    window_seconds: 30
    bulk_modification: 150   # distinct files created/modified in the window
    rename_burst: 40         # distinct renames in the window
    extension_change: 20     # renames to the same unusual new extension
    many_directories: 15
    cooldown_seconds: 300
  ignored_extensions: []     # e.g. extensions your backup tool writes

# Unknown-threat detection (src/detection/behaviour_baseline.py). Learns this
# machine's normal per-process behaviour while monitoring runs, then flags
# strong deviations as "Unknown suspicious activity". Learning assumes the
# machine is not compromised during that time.
anomaly_baseline:
  enabled: true
  min_cycles: 60             # monitoring cycles before training (~5 min at 5 s)
  min_samples: 3000          # process snapshots before training
  threshold_quantile: 0.995  # ~0.5% of normal snapshots would score this high
  alert_cooldown_seconds: 3600

# Graduated Response (src/response/response_manager.py)
# High/Critical threats with a live process get *proposals* to suspend
# (High+) or terminate (Critical) it. A logged-in user must approve each one.
# With execution_enabled: false, approvals are recorded as dry runs and
# nothing is done to the process.
response:
  execution_enabled: false
  proposal_ttl_minutes: 30
  max_executions_per_minute: 5
  # protected_processes: [...]  # defaults to core Windows processes

# Database Configuration
database:
  type: "sqlite"
  path: "data/db/threats.db"
  backup_enabled: true
  backup_interval: 86400  # 24 hours in seconds
  max_log_age_days: 30  # Delete logs older than 30 days

# Dashboard Configuration
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5000
  auto_refresh_interval: 10  # seconds
  max_threats_display: 50

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json, text
  log_to_file: true
  log_file: "data/logs/app.log"
  max_log_size_mb: 10
  backup_count: 5

# Alert Configuration
alerts:
  enabled: true
  high_risk_immediate: true
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender: "your-email@gmail.com"
    recipients:
      - "admin@example.com"
  
  # Console alerts
  console:
    enabled: true
    colored_output: true

# ML Model Configuration
ml_models:
  training:
    test_size: 0.2
    random_state: 42
    n_estimators: 100
    
  feature_engineering:
    scaling: true
    encoding: "label"  # label, onehot
    
  retraining:
    enabled: false
    interval_days: 7

# Data Generation (for testing/simulation)
data_generation:
  enabled: true
  simulation_mode: true
  generate_benign: true
  generate_malicious: true
  benign_ratio: 0.9  # 90% benign, 10% malicious

# Performance Settings
performance:
  max_threads: 4
  queue_size: 1000
  batch_processing: true
  batch_size: 100

# Email Notifications Configuration
notifications:
  enabled: true
  notify_on_critical: true
  notify_on_high: true
  notify_on_medium: false
  notify_on_low: false
  cooldown_seconds: 300  # duplicate-alert suppression window per recipient
  recipients:  # trusted admin addresses; others are added via email verification
    - "rudrabhakt928@gmail.com"
  smtp:
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your-email@gmail.com"
    sender_password: ""
    sender_password_env: "SECUREX_SMTP_PASSWORD"
    sender_email_env: "SECUREX_SMTP_SENDER"
    use_tls: true
    timeout_seconds: 15
    retry_attempts: 3
    retry_delay: 2
