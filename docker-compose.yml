services:
  securex:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5000}
    volumes:
      - securex-data:/app/data
    restart: unless-stopped

volumes:
  securex-data:
